name: Collect lots (manual)

# Sodré/Palácio collectors also run on AWS Lambda (see infra/template.yaml).
# Use this workflow only when you need a full re-collect outside the Lambda schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-lots
  cancel-in-progress: true

jobs:
  sodre:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pydantic httpx
      - name: Collect Sodré
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_REGION: sa-east-1
          TABLE_NAME: leilao-radar-lotes
          PYTHONPATH: .
        run: python -m collector.handler

  palacio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pydantic httpx
      - name: Collect Palácio
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: sa-east-1
          AWS_REGION: sa-east-1
          TABLE_NAME: leilao-radar-lotes
          PYTHONPATH: .
        run: python -m collector.palacio_handler
