name: Deploy VerifyRadar

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync application source
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            --exclude '.env' \
            --exclude '.env.backup' \
            --exclude 'database/*.sqlite' \
            --exclude '.phpunit.result.cache' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=120" \
            web/ \
            ubuntu@${{ secrets.SERVER_HOST }}:/home/ubuntu/leilao-radar/

      - name: Build images and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            ubuntu@${{ secrets.SERVER_HOST }} \
            'cd /home/ubuntu/leilao-radar && chmod +x build.sh deploy/*.sh && PUSH=false bash build.sh && SKIP_PULL=true bash deploy/deploy.sh'

      - name: Apply host nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            ubuntu@${{ secrets.SERVER_HOST }} \
            'cd /home/ubuntu/leilao-radar && bash deploy/post-deploy.sh'
